task_manager.list:
  path: "/task-manager"
  defaults:
    _controller: '\Drupal\task_manager\Controller\TaskManagerController::listTasks'
    _title: "My Tasks"
  requirements:
    _permission: "access content"

task_manager.add:
  path: "/task-manager/add"
  defaults:
    _form: '\Drupal\task_manager\Form\TaskAddForm'
    _title: "Add New Task"
  requirements:
    _permission: "add tasks"

task_manager.delete:
  path: "/task-manager/delete/{task_id}"
  defaults:
    _controller: '\Drupal\task_manager\Controller\TaskManagerController::deleteTask'
    _title: "Delete Task"
  requirements:
    _permission: "administer nodes"

task_manager.update_status:
  path: '/task/update/{task_id}'
  defaults:
    _controller: '\Drupal\task_manager\Controller\TaskManagerController::updateTaskStatus'
  requirements:
    _permission: 'access content'
  options:
    _format: 'json'
