activity_logger.show:
  path: '/activity-logger'
  defaults:
    _controller: '\Drupal\activity_logger\Controller\dashboardController::list_user_activities'
    _title: 'User Activities'
  requirements:
    _permission: 'access content'

activity_logger.delete_activity:
  path: '/activity-logger/delete/{id}'
  defaults:
    _controller: '\Drupal\activity_logger\Controller\dashboardController::delete_activity'
    _title: 'Delete Activity'
  requirements:
    _permission: 'access administration pages'
  options:
    parameters:
      id:
        type: integer
